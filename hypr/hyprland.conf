# #######################################################################################
# HYPRLAND CONFIG (split)
# #######################################################################################

# File structure:
# - monitors.conf
# - theme/theme.conf
# - keybinds.conf
# - windowsrules.conf

exec-once = nm-applet --indicator
exec-once = waybar


source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/theme/theme.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowsrules.conf