source = $HOME/.config/hypr/hyprlock/theme.conf

background {
    path=$HOME/.config/hypr/theme/img/citynight.jpg
    #blur_passes = 2
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_family = SF Pro Text Bold
    font_size = 130
    position = 0, 80
    halign = center
    valign = center
    color = rgba(255,255,255,0.7)
    shadow_passes = 2
    shadow_size = 4
}
label {
    text = cmd[update:10000] echo "$(date +'%A, %d %B')"
    font_size = 18
    position = 0, -30
    font_family = SF Pro Text Bold
    halign = center
    valign = center
    color = rgba(255,255,255,0.7)
    shadow_passes = 2
    shadow_size = 4
}

input-field {
    size = 40, 40
    position = 0, 140
    halign = center
    valign = bottom
    outline_thickness = 2
    shadow_passes = 2
    shadow_size = 8
    blur_passes = 3
    blur_size = 6
    inner_color = rgba(30,30,35,0.4)
    outer_color = rgba(255,255,255,0.15)
    font_color  = rgba(255,255,255,1)
    shadow_color = rgba(0,0,0,0.5)
    fade_on_empty = true
    dots_center = true
    outer_color = rgba(0,255,200,1) rgba(0,100,255,1) 45deg
}

label {
    text = cmd[update:1000] sh -c "/usr/bin/playerctl -p spotify metadata --format '\{{title}}' 2>/dev/null | head -c 40"
    font_family = SF Pro Text Bold
    font_size = 18
    position = 10, 10
    color = rgba(255,255,255,0.7)
    halign = left
    valign = bottom
}    

label {
    text = cmd[update:5000] sh -c "$HOME/.config/hypr/hyprlock/modules/battery.sh icon"
    font_family = "JetBrainsMono Nerd Font"
    font_size = 20
    position = -64,11
    halign = right
    valign = bottom
}

label {
    text = cmd[update:5000] sh -c "$HOME/.config/hypr/hyprlock/modules/battery.sh percent"
    font_family = SF Pro Text Bold
    font_size = 15
    position = -20, 14
    halign = right
    valign = bottom
}



