# Hycon Power Safe mode settings
# Read by waybar/scripts/power-safe.sh. Every value can also be overridden
# with an environment variable of the same name.

# CPU limit applied when Power Safe is enabled (cpupower).
HYCON_POWERSAFE_MAX_FREQ="1.5GHz"
HYCON_POWERSAFE_MIN_FREQ="400MHz"
HYCON_POWERSAFE_GOVERNOR="powersave"
HYCON_POWERSAFE_EPP="power"
HYCON_POWERSAFE_BOOST="0"

# Platform profile while Power Safe is enabled.
# HP Victus choices: cool quiet balanced performance.
HYCON_POWERSAFE_PLATFORM_PROFILE="quiet"

# TLP integration: verify TLP and start it if it is not running.
HYCON_POWERSAFE_TLP="1"
HYCON_POWERSAFE_START_TLP="1"

# NVIDIA dGPU runtime power management: auto = suspend when idle.
HYCON_POWERSAFE_GPU_PM="auto"

# Display refresh rate while Power Safe is enabled.
# Disable with HYCON_POWERSAFE_DISPLAY="0".
# "max" restores the highest refresh rate available for the current
# resolution when Power Safe is disabled.
HYCON_POWERSAFE_DISPLAY="1"
HYCON_POWERSAFE_REFRESH_ON="60"
HYCON_POWERSAFE_REFRESH_OFF="max"

# Desktop notifications and Waybar refresh signal.
# Keep the signal in sync with custom/power-safe in waybar/config.jsonc.
HYCON_POWERSAFE_NOTIFY="1"
HYCON_POWERSAFE_REFRESH_SIGNAL="9"
