# Hycon power profile
# Installed to /etc/tlp.d/99-hycon-power.conf
#
# Battery behaviour:
#   - powersave governor, power EPP, boost off
#   - quiet platform profile
#   - NVIDIA dGPU is allowed to runtime-suspend (RTD3) and power down
# AC behaviour:
#   - balanced performance, boost on, NVIDIA stays available

TLP_ENABLE=1

# CPU
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Platform profile (HP Victus: cool quiet balanced performance)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=quiet

# PCIe runtime PM
# Keep the safe defaults for the other drivers, but let the NVIDIA GPU
# suspend (and enter RTD3/D3cold) when unplugged.
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST="amdgpu mei_me nouveau xhci_hcd"
RUNTIME_PM_DENYLIST=""

# Storage / USB
USB_AUTOSUSPEND=1
DISK_APM_LEVEL_ON_AC="128"
DISK_APM_LEVEL_ON_BAT="128"
