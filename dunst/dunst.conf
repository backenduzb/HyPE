[global]
width = (0, 360)
origin = top-right
offset = (20, 50)
markup = full
font = SF Pro Mono 10
format = "<b>%s</b>\n%b"
corner_radius = 14
frame_width = 1
gap_size = 8

[urgency_low]
background = "#111111CC"
foreground = "#888888"
frame_color = "#2A2A2A"
timeout = 4

[urgency_normal]
background = "#0D0D0DE6"
foreground = "#E8E8E8"
frame_color = "#383838"
timeout = 6

[urgency_critical]
background = "#000000F5"
foreground = "#FFFFFF"
frame_color = "#FFFFFF"
timeout = 0
